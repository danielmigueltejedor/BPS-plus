name: 🐛 Bug report
description: Report a reproducible problem with BPS+
title: "[Bug]: "
labels: ["type: bug", "status: needs triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove MAC addresses, entity IDs, floor plans and other private data before submitting logs or screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - BLE scanning
        - Positioning / trilateration
        - Calibration
        - Floor plan / zones
        - Persons / beacons
        - Frontend / map
        - Configuration flow
        - Installation / HACS
        - Performance
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Start...
        3. Observe...
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.1
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: BPS+ version
      placeholder: e.g. 2.0.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options: [HACS, Manual, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Enable debug logging if useful and remove private identifiers.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the latest BPS+ release and searched existing issues.
          required: true
        - label: I removed personal data and secrets from the report.
          required: true
